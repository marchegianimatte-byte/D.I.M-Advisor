<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>D2 Auditor - Test Runner (Milestone 0 - 4)</title>
  <style>
    body { font-family: monospace; background: #0e1116; color: #e6edf3; padding: 20px; }
    .pass { color: #3fb950; }
    .fail { color: #f85149; }
    #test-summary { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" defer></script>
  <script src="../config/default_rules.js" defer></script>
  <script src="../src/parser.js" defer></script>
  <script src="../src/wishlist_db.js" defer></script>
  <script src="../src/wishlist_sync.js" defer></script>
  <script src="../src/weapon_eval.js" defer></script>
  <script src="../src/weapons_ui.js" defer></script>
  <script src="../src/armor_eval.js" defer></script>
  <script src="../src/armor_compare.js" defer></script>
  <script src="../src/armor_ui.js" defer></script>
  <script src="../src/rules_ui.js" defer></script>
  <script src="../src/app.js" defer></script>
</head>
<body>
  <h1>D2 Auditor - Test Runner</h1>
  <div id="test-summary">Esecuzione test...</div>
  <ul id="test-results"></ul>
  <div style="display:none">
    <span id="weapons-count">0</span><span id="weapons-meta"></span>
    <span id="armor-count">0</span><span id="armor-meta"></span>
    <input id="weapon-search" value="">
    <select id="weapon-mode-filter"><option value="pve">PvE</option><option value="pvp">PvP</option><option value="all">all</option></select>
    <select id="weapon-verdict-filter"><option value="ALL">ALL</option><option value="TIENI (Wishlist DIM)">TIENI (Wishlist DIM)</option><option value="TIENI">TIENI</option></select>
    <select id="weapon-type-filter"><option value="ALL">ALL</option></select>
    <select id="weapon-wishlist-filter"><option value="all">all</option><option value="wishlist_only">Solo Wishlist</option><option value="aegis">Aegis</option><option value="voltron">Voltron</option></select>
    <button id="sync-wishlist-btn"></button><span id="wishlist-sync-status"></span>
    <span id="weapons-filter-summary"></span>
    <table><tbody id="weapons-table-body"></tbody></table>
    <select id="armor-owner-filter"></select>
    <input id="armor-include-mods" type="checkbox" checked>
    <div id="armor-waste-summary"></div><div id="armor-stats-grid"></div><div id="armor-sets-list"></div>
    <table><tbody id="armor-table-body"></tbody></table>
    <div id="rules-armor-targets"></div><select id="rules-archetype-select"></select><div id="rules-combos-list"></div>
    <input id="new-combo-name"><select id="new-combo-mode"><option value="pve">pve</option><option value="pvp">pvp</option></select>
    <input id="new-combo-col3"><input id="new-combo-col4">
    <input id="import-rules-file" type="file"><input id="import-rules-url"><span id="rules-import-status"></span>
    <button id="import-rules-url-btn"></button><button id="add-combo-btn"></button><button id="export-rules-btn"></button><button id="reset-rules-btn"></button>
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var resultsEl = document.getElementById('test-results');
      var summaryEl = document.getElementById('test-summary');
      var passed = 0, failed = 0;

      function assert(condition, message) { if (!condition) throw new Error(message || 'Assertion failed'); }
      function runTest(name, fn) {
        var li = document.createElement('li');
        try { fn(); passed++; li.className = 'pass'; li.textContent = '[PASS] ' + name; }
        catch (err) { failed++; li.className = 'fail'; li.textContent = '[FAIL] ' + name + ' -> ' + err.message; }
        resultsEl.appendChild(li);
      }

      var SAMPLE_WEAPONS_CSV = [
        'Name,Hash,Id,Tag,Tier,Type,Category,Element,Power,Locked,Equipped,Crafted,Perks 0,Perks 1,Perks 2,Perks 3,Perks 4,Perks 5',
        'Araldo del Fato,1216319404,1,favorite,5,Cannone portatile,KineticSlot,Kinetic,2000,true,true,false,Telaio adattivo,Canna scanalata*,Fuorilegge*,Carica esplosiva*,Conta-uccisioni,Livello 10',
        'Araldo del Fato (Adepta),9876543210,4,,0,Cannone portatile,KineticSlot,Kinetic,1990,false,false,false,Telaio adattivo,Canna estesa,Movimento perpetuo*,Occhio del ciclone*,Tracciatore,Kill Tracker',
        'Predatore Apicale,1851777734,2,keep,3,Lanciarazzi,Power,Solar,2000,true,false,true,Telaio adattivo,Lancio rapido*,Ricostruzione*,Fuso bipede,,',
        'Arma Mediocre,9999999999,3,,Legendary,Cannone portatile,Energy,Void,1990,false,false,false,Telaio di precisione,Canna estesa,Senso del pericolo,Adagio,,'
      ].join('\n');

      var SAMPLE_ARMOR_CSV = [
        'Name,Hash,Id,Tag,Tier,Rarity,Type,Equippable,Power,Locked,Equipped,Health (Base),Melee (Base),Grenade (Base),Super (Base),Class (Base),Weapons (Base),Health,Melee,Grenade,Super,Class,Weapons,Perks 0,Perks 1',
        'Maschera di Bakris,2177524718,10,favorite,5,Esotica,Casco,Cacciatori,2000,true,true,18,14,2,16,2,12,28,14,2,16,2,12,Salute +10*,Doratura crescente',
        'Elmo Deposito,2177524719,11,,5,Leggendaria,Cappuccio,Cacciatori,1990,false,false,20,10,5,10,15,5,20,10,5,10,15,5,,'
      ].join('\n');

      runTest('M0/M4/M5/M7: Parser estrae intrinsic, rarity, baseStats, baseTotal, archetype, classType e Vault', function () {
        var wRes = window.App.Parser.parseAndNormalize(SAMPLE_WEAPONS_CSV, 'destinyWeapons.csv');
        var aRes = window.App.Parser.parseAndNormalize(SAMPLE_ARMOR_CSV, 'destinyArmor.csv');
        assert(wRes.items.length === 4, 'Armi attese 4');
        assert(wRes.items[0].intrinsic === 'Telaio adattivo', 'Intrinsic atteso Telaio adattivo');
        assert(wRes.items[0].perks.indexOf('Telaio adattivo') === -1, 'Perks 0 non deve stare in perks');
        assert(wRes.items[0].perks.join(' ').indexOf('Conta-uccisioni') === -1, 'Conta-uccisioni non filtrato');
        assert(wRes.items[0].perks.join(' ').indexOf('Livello 10') === -1, 'Livello non filtrato');
        assert(wRes.items[1].perks.join(' ').indexOf('Tracciatore') === -1, 'Tracciatore non filtrato');
        assert(aRes.items.length === 2, 'Devono restare sia equipaggiati che Vault');
        assert(aRes.items[0].equipped === true && aRes.items[1].equipped === false, 'Flag equipped errato');
        assert(aRes.items[1].classType === 'Hunter' && aRes.items[1].slot === 'Helmet', 'classType/slot Vault errati');
        assert(aRes.items[1].baseTotal === 65 && aRes.items[1].archetype === 'Salute / Classe', 'baseTotal/archetype errati');
        assert(aRes.items[0].rarity === 'Esotica', 'rarity non estratta');
        assert(aRes.items[0].baseStats.health === 18 && aRes.items[0].stats.health === 28, 'baseStats/stats errati');
        assert(aRes.items[0].mods.length === 1 && aRes.items[0].mods[0] === 'Salute +10', 'Doratura crescente non filtrata da mods');
      });

      runTest('M1/M4: WeaponEval distingue PvE vs PvP e raggruppa per Name normalizzato + Type', function () {
        var wRes = window.App.Parser.parseAndNormalize(SAMPLE_WEAPONS_CSV, 'destinyWeapons.csv');
        var pveEval = window.App.WeaponEval.evaluateAll(wRes.items, null, 'pve');
        var pvpEval = window.App.WeaponEval.evaluateAll(wRes.items, null, 'pvp');
        assert(pveEval[0].eval.verdict === 'TIENI' && pveEval[1].eval.verdict === 'INFONDI/SCARTA', 'Valutazione PvE errata');
        assert(pvpEval[1].eval.verdict === 'TIENI', 'Copia 2 (Adepta) deve essere TIENI in PvP');
        var groups = window.App.WeaponEval.groupByWeaponKey(pveEval);
        assert(groups.length === 3 && groups[0].count === 2 && groups[0].best.weapon.id === '1', 'Raggruppamento Name+Type errato');
      });

      runTest('M4: WeaponsUI mostra Tier X, intrinsic, perk Attivi/Alternativi senza * e drawer duplicati', function () {
        var wRes = window.App.Parser.parseAndNormalize(SAMPLE_WEAPONS_CSV, 'destinyWeapons.csv');
        window.App.Storage.saveDataset('weapons', wRes.items, 'destinyWeapons.csv');
        document.getElementById('weapon-mode-filter').value = 'pve';
        document.getElementById('weapon-verdict-filter').value = 'ALL';
        window.App.WeaponsUI.render();
        var tbody = document.getElementById('weapons-table-body');
        assert(tbody.innerHTML.indexOf('Tier 5') !== -1 && tbody.innerHTML.indexOf('Telaio adattivo') !== -1, 'Tier X o intrinsic mancanti');
        assert(tbody.innerHTML.indexOf('Attivi') !== -1 && tbody.innerHTML.indexOf('Alternativi') !== -1, 'Colonne Attivi/Alternativi mancanti');
        assert(tbody.querySelector('.perk-pill').textContent.indexOf('*') === -1, 'Asterisco * non rimosso dal testo perk');
        var toggleBtn = tbody.querySelector('.copy-toggle-btn');
        var drawer = tbody.querySelector('.dup-drawer-row');
        assert(toggleBtn && toggleBtn.textContent.indexOf('2 copie') !== -1, 'Bottone contatore copie mancante');
        assert(drawer && drawer.classList.contains('hidden'), 'Drawer deve partire chiuso');
        toggleBtn.click();
        assert(!drawer.classList.contains('hidden'), 'Drawer deve aprirsi al click');
        assert(drawer.querySelectorAll('.dup-item').length === 2, 'Drawer deve mostrare entrambe le copie');
      });

      runTest('M4: Drawer duplicati si apre anche con virgolette doppie nel nome arma', function () {
        var quotedWeapons = [
          { id: '101', hash: '555', name: '"Ammaliatrice" M-17', tier: '5', type: 'Mitraglietta', element: 'Arc', power: 2000, intrinsic: 'Telaio leggero', perks: ['Alimenta la frenesia*', 'Frenesia*'] },
          { id: '102', hash: '555', name: '"Ammaliatrice" M-17', tier: '5', type: 'Mitraglietta', element: 'Arc', power: 1995, intrinsic: 'Telaio leggero', perks: ['Sussistenza*', 'Uno per tutti'] }
        ];
        window.App.Storage.saveDataset('weapons', quotedWeapons, 'destinyWeapons.csv');
        document.getElementById('weapon-mode-filter').value = 'pve';
        document.getElementById('weapon-verdict-filter').value = 'ALL';
        window.App.WeaponsUI.render();
        var tbody = document.getElementById('weapons-table-body');
        var toggleBtn = tbody.querySelector('.copy-toggle-btn');
        var drawer = tbody.querySelector('.dup-drawer-row');
        assert(toggleBtn && drawer && drawer.classList.contains('hidden'), 'Setup drawer arma con virgolette fallito');
        toggleBtn.click();
        assert(!drawer.classList.contains('hidden'), 'Drawer arma con virgolette deve aprirsi al click');
        assert(drawer.querySelectorAll('.dup-item').length === 2, 'Drawer deve mostrare 2 copie');
      });

      runTest('M2/M4: ArmorEval usa le 6 statistiche attuali, esclude Exotic dai set e usa OK/OTTIMIZZABILE/SOSTITUISCI', function () {
        var armorSet = [
          { name: 'Elmo Set A', tier: '5', category: 'Helmet', owner: 'Hunter', equipped: true, stats: { health: 24, weapons: 15 }, perks: ['Bonus Set A'] },
          { name: 'Guanti Set A', tier: '5', category: 'Gauntlets', owner: 'Hunter', equipped: true, stats: { health: 25, weapons: 12 }, perks: ['Bonus Set A'] },
          { name: 'Torso Set A', tier: '5', category: 'Chest Armor', owner: 'Hunter', equipped: true, stats: { health: 30, weapons: 10 }, perks: ['Bonus Set A'] },
          { name: 'Gambe Set A', tier: '5', category: 'Leg Armor', owner: 'Hunter', equipped: true, stats: { health: 18, weapons: 10 }, perks: ['Bonus Set A'] },
          { name: 'Stoicismo', tier: '5', rarity: 'Esotica', category: 'ClassItem', owner: 'Hunter', equipped: true, stats: { health: 10, weapons: 10 }, perks: ['Spirito di Inmost Light'], mods: ['Potenziamento armatura', 'Fonte di classe'] }
        ];
        var res = window.App.ArmorEval.evaluateBuild(armorSet);
        assert(res.sets.length === 1 && res.sets[0].count === 4 && res.sets[0].bonus4 === true, 'Exotic/Stoicismo non deve alterare conteggio set 4/4');
        assert(res.pieces.every(function (p) { return p.verdict === 'OTTIMIZZABILE'; }), 'Set completo con sprechi deve dare OTTIMIZZABILE');
        window.App.Storage.saveDataset('armor', armorSet, 'destinyArmor.csv');
        window.App.ArmorUI.render();
        assert(document.getElementById('armor-table-body').innerHTML.indexOf('Tier 5') !== -1, 'Tier 5 mancante');
        assert(document.getElementById('armor-table-body').innerHTML.indexOf('Potenziamento armatura') === -1, 'Nome bonus set deve essere escluso da MOD');
        assert(document.getElementById('armor-table-body').innerHTML.indexOf('Fonte di classe') === -1, 'Fonte di classe deve essere escluso da MOD');
        assert(document.getElementById('armor-table-body').querySelectorAll('.copy-toggle-btn').length === 0, 'Nessun contatore copie sotto armature');
      });

      runTest('M3/M4: Migrazione d2_auditor_rules e aggiornamento target 0-200', function () {
        localStorage.setItem('d2_auditor_rules', JSON.stringify({
          weapons: window.App.DEFAULT_RULES.weapons,
          armor: { statTargets: { mobility: 50, resilience: 100, health: 120 } }
        }));
        var migrated = window.App.Storage.loadRules();
        assert(migrated.armor.statTargets.mobility === undefined && migrated.armor.statTargets.resilience === undefined, 'Vecchie chiavi non rimosse');
        assert(migrated.armor.statTargets.health === 120 && migrated.armor.statTargets.weapons === 100, 'Migrazione chiavi attuali fallita');
        window.App.RulesUI.render();
        var inp = document.querySelector('#rules-armor-targets input[data-stat-key="health"]');
        assert(inp && inp.max === '200', 'Range input 0-200 mancante');
        inp.value = '90';
        inp.dispatchEvent(new Event('input'));
        assert(document.getElementById('armor-stats-grid').innerHTML.indexOf('Target OK') !== -1, 'Badge Armature non aggiornato');
        window.App.Storage.resetRules();
        window.App.Storage.clearDatasets();
      });

      runTest('M5: ArmorEval segnala sprechi mod +5/+10/tuning e toggle baseStats aggiorna la UI', function () {
        var armorSet = [
          { name: 'Elmo', tier: '5', category: 'Helmet', owner: 'Hunter', equipped: true, baseStats: { health: 20, class: 20 }, stats: { health: 25, class: 20 }, mods: ['Salute +5'] },
          { name: 'Guanti', tier: '5', category: 'Gauntlets', owner: 'Hunter', equipped: true, baseStats: { health: 21, class: 20 }, stats: { health: 21, class: 20 }, mods: ['Salute +10'] },
          { name: 'Torso', tier: '5', category: 'Chest Armor', owner: 'Hunter', equipped: true, baseStats: { health: 20, class: 20 }, stats: { health: 20, class: 20 }, mods: [] },
          { name: 'Gambe', tier: '5', category: 'Leg Armor', owner: 'Hunter', equipped: true, baseStats: { health: 20, class: 24 }, stats: { health: 20, class: 19 }, mods: ['+5 Armi / -5 Classe'] }
        ];
        // Con mod: health=86 (resto 6 -> sprecata), tuning -5 Classe su 24->19 (perde tier -> sprecata)
        window.App.Storage.saveDataset('armor', armorSet, 'destinyArmor.csv');
        var toggle = document.getElementById('armor-include-mods');
        toggle.checked = true;
        window.App.ArmorUI.render();
        assert(document.getElementById('armor-stats-grid').textContent.indexOf('86') !== -1, 'Totale con mod atteso 86');
        assert(document.getElementById('armor-table-body').querySelectorAll('.mod-waste').length >= 2, 'Mod stat/tuning sprecate non segnalate');

        toggle.checked = false;
        toggle.dispatchEvent(new Event('change'));
        assert(document.getElementById('armor-stats-grid').textContent.indexOf('81') !== -1, 'Totale baseStats atteso 81');
        window.App.Storage.clearDatasets();
      });

      runTest('M6: Wishlist DIM ("wish", Aegis vs Voltron) e import regole JSON/CSV (rifiuta .txt)', function () {
        var csv = [
          'Name,Hash,Id,Tag,Tier,Type,Category,Element,Power,Locked,Equipped,Crafted,Wishlist,Wishlist Note,Perks 0,Perks 1,Perks 2',
          'Arma Voltron,777,90,favorite,5,Mitraglietta,Energy,Arc,2000,true,false,false,wish,God Roll PvE (Voltron),Telaio leggero,Perk X,Perk Y',
          'Arma Aegis,778,91,favorite,5,Lanciarazzi,Power,Solar,2000,true,false,false,true,Aegis Endgame DPS,Telaio adattivo,Perk A,Perk B',
          'Arma Entrambe,779,92,favorite,5,Cannone portatile,KineticSlot,Kinetic,2000,true,false,false,wish,Aegis + Voltron pick,Telaio adattivo,Perk C,Perk D'
        ].join('\n');
        var wRes = window.App.Parser.parseAndNormalize(csv, 'destinyWeapons.csv');
        assert(wRes.items[0].wishlistMatch === true && wRes.items[0].wishlistSources.join(',') === 'voltron', 'Valore wish/Voltron non riconosciuto');
        assert(wRes.items[1].wishlistSources.join(',') === 'aegis', 'Fonte Aegis non riconosciuta');
        assert(wRes.items[2].wishlistSources.join(',') === 'aegis,voltron', 'Fonti Aegis + Voltron non riconosciute');

        var ev = window.App.WeaponEval.evaluateWeapon(wRes.items[0]);
        assert(ev.verdict === 'TIENI (Wishlist DIM)' && ev.comboName === 'God Roll PvE (Voltron)', 'Priorità Wishlist DIM errata');

        window.App.Storage.saveDataset('weapons', wRes.items, 'destinyWeapons.csv');
        document.getElementById('weapon-wishlist-filter').value = 'aegis';
        window.App.WeaponsUI.render();
        var rowsAegis = document.getElementById('weapons-table-body').querySelectorAll('tr');
        assert(rowsAegis.length === 2 && document.getElementById('weapons-table-body').innerHTML.indexOf('Aegis + Voltron') !== -1, 'Filtro Aegis o badge fonte errato');
        document.getElementById('weapon-wishlist-filter').value = 'voltron';
        window.App.WeaponsUI.render();
        assert(document.getElementById('weapons-table-body').querySelectorAll('tr').length === 2, 'Filtro Voltron errato');
        document.getElementById('weapon-wishlist-filter').value = 'all';

        // Rifiuto .txt con hash numerici
        var rejected = window.App.RulesUI.importRulesText('dimwishlist:item=12345&perks=111,222', 'wishlist.txt');
        assert(rejected === false, 'File .txt a hash numerici deve essere rifiutato');

        // Import CSV testuale
        var rulesCsv = 'Archetipo,Nome,Mode,Col 3,Col 4\nsmg,Custom SMG,pve,Perk X,Perk Y';
        var okCsv = window.App.RulesUI.importRulesText(rulesCsv, 'regole.csv');
        assert(okCsv === true, 'Import CSV regole fallito');
        var noWishlistWeapon = Object.assign({}, wRes.items[0], { wishlistMatch: false });
        var evCustom = window.App.WeaponEval.evaluateWeapon(noWishlistWeapon, window.App.Storage.loadRules().weapons, 'pve');
        assert(evCustom.verdict === 'TIENI' && evCustom.comboName === 'Custom SMG', 'Regola importata da CSV non applicata');
        window.App.Storage.resetRules();
        window.App.Storage.clearDatasets();
      });

      runTest('M6: Filtro Aegis/Voltron su armi raggruppate eredita wishlistSources', function () {
        var csv = [
          'Name,Hash,Id,Tag,Tier,Type,Category,Element,Power,Locked,Equipped,Crafted,Wishlist,Wishlist Note,Perks 0,Perks 1,Perks 2',
          'Arma Multi,800,1,favorite,5,Mitraglietta,Energy,Arc,2000,true,true,false,wish,S-Tier Endgame DPS,Telaio leggero,Perk A,Perk B',
          'Arma Multi,800,2,,5,Mitraglietta,Energy,Arc,1995,false,false,false,true,Good roll (PvE),Telaio leggero,Perk C,Perk D',
          'Arma Solo Voltron,801,3,,5,Lanciarazzi,Power,Solar,2000,false,false,false,wish,Boss (PvE),Telaio adattivo,Perk E,Perk F'
        ].join('\n');
        var wRes = window.App.Parser.parseAndNormalize(csv, 'destinyWeapons.csv');
        window.App.Storage.saveDataset('weapons', wRes.items, 'destinyWeapons.csv');
        document.getElementById('weapon-mode-filter').value = 'all';
        document.getElementById('weapon-verdict-filter').value = 'ALL';
        document.getElementById('weapon-type-filter').value = 'ALL';
        document.getElementById('weapon-wishlist-filter').value = 'aegis';
        window.App.WeaponsUI.render();
        var htmlAegis = document.getElementById('weapons-table-body').innerHTML;
        assert(htmlAegis.indexOf('Arma Multi') !== -1 && htmlAegis.indexOf('Arma Solo Voltron') === -1, 'Filtro Aegis su gruppo errato');
        assert(htmlAegis.indexOf('Aegis + Voltron') !== -1, 'Unione fonti gruppo errata');

        document.getElementById('weapon-wishlist-filter').value = 'voltron';
        window.App.WeaponsUI.render();
        var htmlVoltron = document.getElementById('weapons-table-body').innerHTML;
        assert(htmlVoltron.indexOf('Arma Multi') !== -1 && htmlVoltron.indexOf('Arma Solo Voltron') !== -1, 'Filtro Voltron su gruppo errato');
        document.getElementById('weapon-wishlist-filter').value = 'all';
        window.App.Storage.clearDatasets();
      });

      runTest('M6: WishlistSync compatta/deduplica in memoria (IndexedDB) e filtra Aegis/Voltron/Solo Wishlist', function () {
        var aegisTxt = '//notes: Endgame PvE DPS\ndimwishlist:item=1216319404&perks=111,222\n';
        var voltronPveTxt = '//notes: God Roll (PvE)\ndimwishlist:item=1216319404&perks=222,111\n';
        var voltronPvpTxt = '//notes: God Roll (PvP)\ndimwishlist:item=1216319404&perks=333,444\n';
        var pAegis = window.App.WishlistSync.parseDimWishlistTxt(aegisTxt, 'aegis');
        var pVPve = window.App.WishlistSync.parseDimWishlistTxt(voltronPveTxt, 'voltron');
        var pVPvp = window.App.WishlistSync.parseDimWishlistTxt(voltronPvpTxt, 'voltron');
        assert(pAegis.rulesByItem['1216319404'][0].mode === 'pve', 'Parsing mode PvE errato');
        assert(pVPvp.rulesByItem['1216319404'][0].mode === 'pvp', 'Parsing mode PvP errato');

        var rawMerged = {
          '1216319404': [
            pAegis.rulesByItem['1216319404'][0],
            pVPve.rulesByItem['1216319404'][0],
            pVPvp.rulesByItem['1216319404'][0]
          ]
        };
        var perkMap = { '111': 'fuorilegge', '222': 'carica esplosiva', '333': 'movimento perpetuo', '444': 'occhio del ciclone' };
        var compact = window.App.WishlistSync.compactRules(rawMerged, perkMap);
        // 111,222 e 222,111 in PvE devono deduplicarsi in 1 entry con sources ['aegis','voltron'] -> count totale = 2
        assert(compact.count === 2, 'Deduplicazione fallita, atteso count=2, ricevuto ' + compact.count);
        assert(compact.perkMap === undefined, 'perkMap non deve essere salvato nella cache compatta');
        assert(compact.rulesByItem['1216319404'][0].sources.join(',') === 'aegis,voltron', 'Unione fonti deduplicata errata');

        window.App.WishlistDB.setMemoryCache(compact);

        var weapons = [
          { id: '1', hash: '1216319404', name: 'Araldo del Fato', tier: '5', type: 'Cannone portatile', element: 'Kinetic', power: 2000, perks: ['Fuorilegge*', 'Carica esplosiva*'] },
          { id: '2', hash: '999999', name: 'Arma Comune', tier: '5', type: 'Cannone portatile', element: 'Void', power: 1990, perks: ['Adagio'] }
        ];
        var evPve = window.App.WeaponEval.evaluateWeapon(weapons[0], null, 'pve');
        assert(evPve.verdict === 'TIENI' && evPve.wishlistSources.join(',') === 'aegis,voltron', 'Match synced PvE errato');

        window.App.Storage.saveDataset('weapons', weapons, 'destinyWeapons.csv');
        document.getElementById('weapon-mode-filter').value = 'pve';
        document.getElementById('weapon-verdict-filter').value = 'ALL';
        document.getElementById('weapon-type-filter').value = 'ALL';
        document.getElementById('weapon-wishlist-filter').value = 'wishlist_only';
        window.App.WeaponsUI.render();
        var htmlOnly = document.getElementById('weapons-table-body').innerHTML;
        assert(htmlOnly.indexOf('Araldo del Fato') !== -1 && htmlOnly.indexOf('Arma Comune') === -1, 'Filtro Solo Wishlist errato');
        assert(document.getElementById('wishlist-sync-status').textContent.indexOf('2 roll') !== -1, 'Contatore roll wishlist mancante');

        document.getElementById('weapon-mode-filter').value = 'pvp';
        document.getElementById('weapon-wishlist-filter').value = 'aegis';
        window.App.WeaponsUI.render();
        assert(document.getElementById('weapons-table-body').innerHTML.indexOf('Araldo del Fato') === -1, 'Roll PvE non deve matchare in PvP');

        document.getElementById('weapon-mode-filter').value = 'pve';
        document.getElementById('weapon-wishlist-filter').value = 'all';
        window.App.WishlistDB.setMemoryCache(null);
        window.App.Storage.clearDatasets();
      });

      runTest('M7: ArmorCompare confronta slot con Vault, calcola delta sprechi e apre sottotabella UI', function () {
        var build = [
          { name: 'Veste Attuale', tier: '5', type: 'Veste', slot: 'Chest Armor', classType: 'Warlock', owner: 'Stregone', equipped: true, stats: { health: 27 }, baseStats: { health: 27 }, baseTotal: 62, archetype: 'Salute / Classe', perks: ['Set A'] },
          { name: 'Casco', tier: '5', type: 'Casco', slot: 'Helmet', classType: 'Warlock', owner: 'Stregone', equipped: true, stats: { health: 20 }, baseStats: { health: 20 }, baseTotal: 60, perks: ['Set A'] },
          { name: 'Veste Vault Top', tier: '5', type: 'Casacca', slot: 'Chest Armor', classType: 'Warlock', owner: 'Vault', equipped: false, stats: { health: 20 }, baseStats: { health: 20 }, baseTotal: 68, archetype: 'Salute / Granata', perks: ['Set A'] },
          { name: 'Corazza Titano', tier: '5', type: 'Corazza', slot: 'Chest Armor', classType: 'Titan', owner: 'Vault', equipped: false, stats: { health: 20 }, baseStats: { health: 20 }, baseTotal: 70, perks: ['Set A'] }
        ];
        // Attuale health = 47 (7 sprecati). Sostituendo Veste Attuale (27) con Veste Vault Top (20) -> health = 40 (0 sprecati, delta = -7)
        var alts = window.App.ArmorCompare.findSlotAlternatives(build.slice(0, 2), build, build[0], null, { includeMods: true });
        assert(alts.length === 1 && alts[0].piece.name === 'Veste Vault Top', 'Filtro classType/slot Vault errato');
        assert(alts[0].deltaWasted === -7 && alts[0].baseTotal === 68, 'Delta sprechi errato: ' + alts[0].deltaWasted);

        window.App.Storage.saveDataset('armor', build, 'destinyArmor.csv');
        window.App.ArmorUI.render();
        var tbody = document.getElementById('armor-table-body');
        var btn = tbody.querySelector('.armor-compare-btn');
        var drawer = tbody.querySelector('.dup-drawer-row');
        assert(btn && btn.textContent.indexOf('Confronta (1)') !== -1, 'Pulsante Confronta (1) mancante');
        assert(drawer && drawer.classList.contains('hidden'), 'Sottotabella confronto deve partire chiusa');
        btn.click();
        assert(!drawer.classList.contains('hidden') && drawer.innerHTML.indexOf('-7') !== -1, 'Sottotabella confronto non si apre o delta mancante');
        window.App.Storage.clearDatasets();
      });

      summaryEl.textContent = 'Risultato: ' + passed + ' passati, ' + failed + ' falliti.';
      summaryEl.className = failed === 0 ? 'pass' : 'fail';
      document.body.setAttribute('data-test-status', failed === 0 ? 'PASS' : 'FAIL');
    });
  </script>
